name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v4, with: { fetch-depth: 0 } }
      - name: Test IRC bot with mocked sockets
        run: python3 -m unittest discover -s .github/workflows -p test_ircbot.py -v
      - name: Install Pandoc and Asciidoctor
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pandoc asciidoctor
      - { uses: actions/setup-go@v5, with: { go-version-file: go.mod, cache: true } }
      - run: make build
      - run: make bench # test
      - run: make vet
      - run: make -C golden

  Ping-IRC:
    # Always run, announce trunk and tag pushes
    if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/trunk' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    steps:
    - { uses: actions/checkout@v4 }
    - run: git fetch -f --tags  # Fix actions/checkout#290
    - name: Ping-IRC
      if: ${{ always() && !env.ACT }}  # IRCBOT_JOBS indicates 'success'
      env: { IRCBOT_JOBS: "${{ join(needs.*.result, ' ') }}" }
      run: .github/workflows/ircbot.py -q -j "#Anklang" -G
